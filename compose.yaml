services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: profissionais_development
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # Keep the database private to the Compose network. Use
    # `docker compose exec db psql ...` for local administration.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d profissionais_development"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: bash -lc "bundle install && bin/rails db:prepare && bin/rails server -b 0.0.0.0"
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      RAILS_ENV: development
      RAILS_LOG_TO_STDOUT: "true"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/app
      - bundle-cache:/bundle
    stdin_open: true
    tty: true

volumes:
  postgres-data:
  bundle-cache:
