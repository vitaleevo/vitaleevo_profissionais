log_format profissionais_main '$remote_addr - $remote_user [$time_local] "$request" '
                              '$status $body_bytes_sent "$http_referer" '
                              '"$http_user_agent" "$http_x_forwarded_for" '
                              'rt=$request_time uct="$upstream_connect_time" '
                              'uht="$upstream_header_time" urt="$upstream_response_time"';

upstream profissionais_frontend {
  server 127.0.0.1:3001;
}

upstream profissionais_rails {
  server 127.0.0.1:3000;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  "" close;
}

server {
  listen 80;
  listen [::]:80;
  server_name profiangola.ao www.profiangola.ao admin.profiangola.ao operacoes.profiangola.ao app.profiangola.ao;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name profiangola.ao www.profiangola.ao admin.profiangola.ao operacoes.profiangola.ao app.profiangola.ao;

  ssl_certificate /etc/letsencrypt/live/profiangola.ao/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/profiangola.ao/privkey.pem;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  access_log /var/log/nginx/profissionais.access.log profissionais_main;
  error_log /var/log/nginx/profissionais.error.log warn;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  proxy_cookie_flags ~ secure httponly samesite=lax;

  client_max_body_size 20m;
  client_body_timeout 30s;
  client_header_timeout 15s;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Port 443;

  location /up {
    proxy_pass http://profissionais_rails;
  }

  location /api/ {
    proxy_pass http://profissionais_rails;
  }

  location /assets/ {
    proxy_pass http://profissionais_rails;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location /rails/active_storage/ {
    proxy_pass http://profissionais_rails;
  }

  location / {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_pass http://profissionais_frontend;
  }
}
