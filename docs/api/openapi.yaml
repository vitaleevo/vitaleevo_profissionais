  "/api/v1/professionals/search":
    get:
      tags:
      - Professionals
      summary: Pesquisa publica de profissionais por categoria, localizacao administrativa
        e proximidade.
      description: Retorna dados publicos dos profissionais. Quando latitude e longitude
        do cliente sao enviadas, o backend calcula `distance_km`, mas nao revela as
        coordenadas exatas do profissional.
      parameters:
      - name: category_slug
        in: query
        schema:
          type: string
      - name: province
        in: query
        schema:
          type: string
      - name: municipality
        in: query
        schema:
          type: string
      - name: neighborhood
        in: query
        schema:
          type: string
      - name: latitude
        in: query
        description: Latitude do cliente quando a localizacao exata for autorizada.
        schema:
          type: number
      - name: longitude
        in: query
        description: Longitude do cliente quando a localizacao exata for autorizada.
        schema:
          type: number
      - name: radius_km
        in: query
        description: Raio maximo em quilometros aplicado quando latitude e longitude
          forem enviados.
        schema:
          type: number
      responses:
        '200':
          description: Profissionais publicos filtrados e, quando possivel, ordenados
            por distancia.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Professional"
