      - cookieAuth: []
        csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateServiceRequestInput"
          multipart/form-data:
            schema:
              allOf:
              - "$ref": "#/components/schemas/CreateServiceRequestInput"
              - type: object
                properties:
                  attachments:
                    type: array
                    maxItems: 5
                    items:
                      type: string
                      format: binary
      responses:
        '201':
          description: Pedido criado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/ServiceRequest"
